name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - run: dotnet restore Okisioli.Teacups.UI.slnx
      - run: dotnet build Okisioli.Teacups.UI.slnx --no-restore -c Release
      - run: dotnet test Okisioli.Teacups.UI.slnx --no-build -c Release
