name: Publish to NuGet.org

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - run: dotnet restore Okisioli.Teacups.UI.slnx
      - run: dotnet build Okisioli.Teacups.UI.slnx --no-restore -c Release -m:1
      - run: dotnet pack Okisioli.Teacups.UI.slnx --no-build -c Release -m:1
      - name: Authenticate to NuGet
        uses: NuGet/login@v1
        id: login
        with:
          user: oli.G
      - name: Publish to NuGet.org
        shell: bash
        run: |
          shopt -s nullglob
          packages=(publish/*.nupkg)
          if (( ${#packages[@]} == 0 )); then
            echo "No packages were produced."
            exit 1
          fi
          for package in "${packages[@]}"; do
            dotnet nuget push "$package" \
              --source "https://api.nuget.org/v3/index.json" \
              --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
              --skip-duplicate
          done
