name: Avalonia demo

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DEMO_PROJECT: Okisioli.Teacups.UI.Demo.Avalonia.Browser

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet workload install wasm-tools
      - run: dotnet publish "demo/$DEMO_PROJECT/$DEMO_PROJECT.csproj" -c Release -m:1
      - run: test -f "publish/$DEMO_PROJECT/wwwroot/index.html"
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          path: publish/${{ env.DEMO_PROJECT }}/wwwroot

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
