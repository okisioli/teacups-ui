name: Publish to NuGet.org

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - run: dotnet restore Okisioli.Teacups.UI.slnx
      - run: dotnet build Okisioli.Teacups.UI.slnx --no-restore -c Release
      - run: dotnet pack Okisioli.Teacups.UI.slnx --no-build -c Release -o publish
      - name: Publish to NuGet.org
        shell: bash
        run: |
          shopt -s nullglob
          packages=(publish/*.nupkg)
          if (( ${#packages[@]} == 0 )); then
            echo "No packages were produced."
            exit 1
          fi
          for package in "${packages[@]}"; do
            dotnet nuget push "$package" \
              --source "https://api.nuget.org/v3/index.json" \
              --api-key "${{ secrets.NUGET_API_KEY }}" \
              --skip-duplicate
          done
